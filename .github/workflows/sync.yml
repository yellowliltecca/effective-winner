name: SGU 111 Schedule

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sgu111-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Save previous schedule for change detection
        run: cp data/schedule.json /tmp/sgu111-previous.json

      - name: Update schedule
        id: refresh
        continue-on-error: true
        run: python scripts/update.py

      - name: Track changes
        run: python scripts/track_changes.py /tmp/sgu111-previous.json data/schedule.json

      - name: Cache teacher photos
        run: python scripts/cache_teacher_photos.py

      - name: Check notification module syntax
        run: |
          node --check features.js
          node --check student-tools.js
          node --check sw.js

      - name: Save changes
        run: |
          git add data/schedule.json index.html assets/teachers
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update SGU schedule"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
